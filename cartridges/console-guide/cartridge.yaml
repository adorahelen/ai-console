# ─────────────────────────────────────────────────────────
# console-guide — 예시 카트리지 1호
# ai-console 자신의 사용법을 안내하는 도우미.
# "도메인 = 카트리지 하나"를 보여주는 최소 실물이자,
# 새 카트리지를 만들 때 베끼기 좋은 살아있는 레퍼런스.
# ─────────────────────────────────────────────────────────
name: console-guide
version: 1.0.0
description: >
  ai-console의 설치·설정·카트리지 제작 방법을 안내하는 도우미.
  지식은 전부 이 리포의 공개 문서에서 나왔다.

# ── 슬롯 1: 프롬프트 ──────────────────────────────────────
# qna만 캐릭터를 입히고, intent 분류·action·plan은 엔진 기본값을 그대로 쓴다.
# (config.ini [prompts]에서 qna 계열 키만 이 파일로 바꾸면 장착 끝)
prompts:
  qna: prompts/qna.yaml

# ── 슬롯 2: 지식 ──────────────────────────────────────────
# knowledge/*.yaml → POST /api/ai/prompts/bulk 로 업로드
knowledge:
  dir: knowledge/

# ── 슬롯 3: 모델 ──────────────────────────────────────────
model:
  recommended: gemma4-e4b-q4
  minimum_tier: cpu-only
  notes: 안내 도우미라 작은 모델로 충분. 어떤 티어에서도 동작.

plugins: []
