<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-console 채팅</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --dim:#94a3b8;
          --acc:#38bdf8; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --u:#0b3a4a; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif;
         display:flex; flex-direction:column; max-width:900px; margin:0 auto; }

  header { padding:16px 18px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:19px; } h1 span{color:var(--acc);}
  .sub { color:var(--dim); font-size:12.5px; margin-top:3px; }
  .keybar { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .keybar input { flex:1; background:#0b1220; color:var(--txt); border:1px solid var(--line);
                  border-radius:8px; padding:7px 10px; font-size:13px; }
  .keybar .st { font-size:12px; color:var(--dim); white-space:nowrap; }
  .keybar .st.ok{color:var(--ok);} .keybar .st.err{color:var(--err);}

  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; }
  .msg .who { font-size:11px; color:var(--dim); margin-bottom:4px; letter-spacing:.04em; }
  .msg .body { border-radius:12px; padding:11px 14px; font-size:14.5px; line-height:1.62;
               white-space:pre-wrap; word-break:break-word; }
  .msg.u { align-self:flex-end; }
  .msg.u .who { text-align:right; }
  .msg.u .body { background:var(--u); border:1px solid #14506a; }
  .msg.a .body { background:var(--card); border:1px solid var(--line); }
  .msg.a .body code, .msg.a .body pre { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .sources { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .sources .pill { background:#0b1220; border:1px solid var(--line); border-radius:999px;
                   padding:2px 9px; font-size:11.5px; color:var(--dim); }
  .cursor::after { content:'▋'; color:var(--acc); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }
  @media (prefers-reduced-motion: reduce){ .cursor::after{animation:none;} }
  .empty { color:var(--dim); font-size:13.5px; text-align:center; margin:auto; max-width:52ch; line-height:1.7; }

  footer { padding:12px 16px 16px; border-top:1px solid var(--line); }
  .inbar { display:flex; gap:10px; align-items:flex-end; }
  #q { flex:1; background:#0b1220; color:var(--txt); border:1px solid var(--line);
       border-radius:10px; padding:11px 13px; font-size:14.5px; font-family:inherit;
       resize:none; max-height:160px; line-height:1.5; }
  #send { background:var(--acc); color:#052033; border:0; border-radius:10px;
          padding:11px 18px; font-size:14.5px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.4; cursor:wait; }
  .hint { color:var(--dim); font-size:11.5px; margin-top:7px; }
</style>
</head>
<body>

<header>
  <h1>🕹️ <span>ai-console</span> 채팅</h1>
  <div class="sub">장착된 카트리지(도메인 지식 + 페르소나)로 답합니다 · RAG 근거 표시</div>
  <div class="keybar">
    <input type="password" id="key" placeholder="API 키 (Bearer) — api_keys/default.key">
    <span class="st" id="kst">키 입력</span>
  </div>
</header>

<div id="log">
  <div class="empty" id="empty">질문을 입력하세요. 콘솔에 장착된 도메인 카트리지의 지식과 페르소나로 답변하고,
    참조한 문서를 아래에 표시합니다. (Enter 전송 · Shift+Enter 줄바꿈)</div>
</div>

<footer>
  <div class="inbar">
    <textarea id="q" rows="1" placeholder="메시지를 입력하세요…"></textarea>
    <button id="send">전송</button>
  </div>
  <div class="hint">POST /api/query/stream (SSE) · 현재 서버는 답변 완성 후 1프레임으로 보냅니다(토큰 단위 아님).</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');

// API 키 — 위저드와 공유(localStorage ac_key)
$('key').value = localStorage.getItem('ac_key') || '';
$('key').addEventListener('input', () => { localStorage.setItem('ac_key', $('key').value.trim()); setKst(); });
function setKst(){ const k=$('key').value.trim(); $('kst').textContent = k? '키 저장됨':'키 입력'; $('kst').className='st'+(k?' ok':''); }
setKst();

// textarea 자동 높이
const qEl = $('q');
qEl.addEventListener('input', () => { qEl.style.height='auto'; qEl.style.height=Math.min(qEl.scrollHeight,160)+'px'; });
qEl.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
$('send').addEventListener('click', send);

function addMsg(who, cls){
  const em=$('empty'); if(em) em.remove();
  const m=document.createElement('div'); m.className='msg '+cls;
  m.innerHTML='<div class="who"></div><div class="body"></div>';
  m.querySelector('.who').textContent=who;
  logEl.appendChild(m); logEl.scrollTop=logEl.scrollHeight;
  return m;
}
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let busy=false;
async function send(){
  const q=qEl.value.trim(); const key=$('key').value.trim();
  if(!q || busy) return;
  if(!key){ $('kst').textContent='키 먼저 입력'; $('kst').className='st err'; return; }
  busy=true; $('send').disabled=true;
  qEl.value=''; qEl.style.height='auto';

  addMsg('나','u').querySelector('.body').textContent=q;
  const am=addMsg('어시스턴트','a'); const body=am.querySelector('.body'); body.classList.add('cursor');
  let answer='';

  try{
    const res=await fetch('/api/query/stream',{ method:'POST',
      headers:{ 'Authorization':'Bearer '+key, 'Content-Type':'application/json' },
      body:JSON.stringify({ query:q, query_type:'general' }) });
    if(!res.ok){ throw new Error('HTTP '+res.status); }
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
        if(!line.startsWith('data:')) continue;
        let d; try{ d=JSON.parse(line.slice(5).trim()); }catch{ continue; }
        if(d.chunk){ answer+=d.chunk; body.textContent=answer; logEl.scrollTop=logEl.scrollHeight; }
        if(d.sources && d.sources.length){
          const sv=document.createElement('div'); sv.className='sources';
          sv.innerHTML=d.sources.map(s=>'<span class="pill">📄 '+esc(String(s))+'</span>').join('');
          am.appendChild(sv);
        }
        if(d.error){ body.textContent=answer+'\n[오류] '+d.error; }
      }
    }
    if(!answer) body.textContent='(빈 응답)';
  }catch(e){
    body.textContent='연결/응답 오류: '+e.message+'  — 콘솔 기동·API 키·모델 로딩 확인';
  }finally{
    body.classList.remove('cursor'); busy=false; $('send').disabled=false; qEl.focus();
  }
}
qEl.focus();
</script>
</body>
</html>
