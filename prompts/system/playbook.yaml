        "description": "지정된 서비스의 상태와 오류율을 조회합니다.",
        "command_name": "check-service-health",
        "configs": "{\"target\":\"${task/be00da88-bc20-495a-b598-6a3a799c5570/target}\",\"PLAYBOOK_METADATA\":{\"target\":{\"name\":\"target\",\"type\":\"playbook-var\",\"value\":{\"variableName\":\"target\",\"taskName\":\"플레이북 시작\",\"type\":0,\"value\":\"${task/be00da88-bc20-495a-b598-6a3a799c5570/target}\"},\"required\":true}}}",
        "retry_count": 0,
        "retry_time": 600,
