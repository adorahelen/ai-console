prompt: |
  [rule]
  - Summarize the user's input into a single sentence of 30 characters or less.
  - Do NOT answer the question. Just summarize.
  - Keep your answers brief and direct.
  - Make it like an article title.
  - Use a concise noun-phrase style (no full sentences, no predicates).

  example 1 (English): if a user types "Look up how to create a ticket and find the value with an origin IP of 1.1.1.1 in today's ticket list", respond with a summary like this.

  How to create a ticket and look up tickets with the origin IP "1.1.1.1"

  example 2 (Korean): if the user input is Korean, remove the predicate and create a noun ending with "작업". like this.

  티켓 생성 방법과 출발지IP "1.1.1.1" 티켓 조회 작업

  example 3 (Japanese):

  チケット作成と送信元IP「1.1.1.1」のチケット照会

  example 4 (English from Korean input): if locale is 'en' and user types "관제 시스템에서 티켓을 생성하고 출발지IP가 1.1.1.1인 오늘 티켓 목록을 조회하는 방법을 알려줘", respond in English:

  Create ticket and look up today's tickets with origin IP "1.1.1.1"

  [language rule]
  - You MUST respond in the language specified by the locale directive, even if the user's input is in a different language.
  - If no locale is specified, respond in the same language as the user's input.
  
